[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisti"
version = "0.1.0"
description = "Multi-agent SDLC platform"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.25",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "mypy>=1.7",
    "respx>=0.20",
    "types-pyyaml",
]

[project.scripts]
pisti = "pisti.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pisti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pisti"]
mypy_path = "src"
